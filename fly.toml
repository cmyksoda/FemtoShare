app = "femtoshare"
primary_region = "iad"
kill_signal = "SIGINT"
kill_timeout = "5s"

[experimental]
  auto_rollback = true

[env]
  LITESTREAM_BUCKET = "femtoshare-litestream"
  LITESTREAM_ENDPOINT = "s3.us-west-002.backblazeb2.com"
  LITESTREAM_RETENTION = "72h"
  PORT = "8080"
  PS_BEHIND_PROXY = "yes"

[[mounts]]
  source = "pico_data2"
  destination = "/data"
  processes = ["app"]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 25
    soft_limit = 20

  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "1s"
    method = "GET"
    path = "/"
